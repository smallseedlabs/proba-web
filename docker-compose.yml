version: '3.8'

services:
  web:
    build: .
    ports:
      - "5173:8080"
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3000}
      - AUTH_LOGIN_PATH=${AUTH_LOGIN_PATH:-/v1/auth/login}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: proba-network
    external: false
