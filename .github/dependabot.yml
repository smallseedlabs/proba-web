version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Major upgrades (TypeScript, zod, eslint, vitest, ...) are done deliberately, by hand, not by bot.
    # eslint-plugin-react-refresh 0.5+ requires eslint 9/10; that lands with the eslint major, not as a grouped minor.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    # One pull request for all workflow action updates (majors included: they are runtime-only for CI).
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Base image / service major versions (node, nginx, postgres, redis, clickhouse) are upgraded deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
